<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/logo-velox-prism.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Landing pages em até 3 dias úteis, com escopo e materiais aprovados. Sites, Perfil da Empresa no Google, campanhas e programação com a Velox Tech Studio."
    />
    <title>Velox Tech Studio — Landing pages, sites e marketing</title>

    <!-- Fonte principal -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Pure Black Obsidian Base */
      html, body {
        background-color: #000000;
        color: #f5f5f7;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        scroll-behavior: smooth;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }

      /* Apple Subdued Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #000000;
      }
      ::-webkit-scrollbar-thumb {
        background: #262629;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3a3a3e;
      }

      /* Subtle metallic text gradients */
      .text-titanium {
        background: linear-gradient(180deg, #FFFFFF 0%, #a1a1a6 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .text-subtle-silver {
        background: linear-gradient(180deg, #d1d1d6 0%, #86868b 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* Bento Card Styling (beUI / shadcn) */
      .bento-card {
        background: rgba(13, 13, 15, 0.78);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        position: relative;
        overflow: hidden;
      }
      .bento-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
      }
      .bento-card:hover {
        border-color: rgba(255, 255, 255, 0.18);
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body class="bg-black text-neutral-100 selection:bg-neutral-800 selection:text-white">
    <noscript>Habilite o JavaScript para visualizar o site da Velox Tech Studio.</noscript>
    <div id="root"></div>
  </body>
</html>
